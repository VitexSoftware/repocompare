# repocompare UserParameters for Zabbix Agent 2
#
# Drop this file into /etc/zabbix/zabbix_agent2.d/ and restart zabbix-agent2.
#
# IMPORTANT: raise the global agent timeout to at least 30 seconds,
# because repocompare fetches Packages files over HTTP/HTTPS.
# In /etc/zabbix/zabbix_agent2.conf set:
#   Timeout=30
#
# Requirements:
#   - repocompare installed and on PATH for the zabbix user
#     (e.g. pip install --break-system-packages repocompare, or system package)
#   - python3-dotenv optional (repocompare loads .env if present)
#
# ─── Distribution discovery ──────────────────────────────────────────────────
#
# Called once per day by the LLD rule "Distribution discovery".
# Parameter $1 is the value of the {$REPOCOMPARE_DISTS} template macro,
# e.g. "bookworm,trixie,forky,jammy,noble,raccoon".
# Returns a Zabbix LLD JSON array, e.g.:
#   [{"{#DIST}":"bookworm"},{"{#DIST}":"trixie"},...]
#
UserParameter=repocompare.dist.discovery[*],repocompare --discover-dists "$1" 2>/dev/null

# ─── Per-distribution comparison ─────────────────────────────────────────────
#
# Called hourly per discovered distribution (master item for all dependent items).
# Parameters:
#   $1 = REPO_A  (testing/staging repo base URL)
#   $2 = REPO_B  (production repo base URL)
#   $3 = DIST    (distribution codename, e.g. bookworm)
#   $4 = COMPONENT (e.g. main)
#   $5 = ARCH    (e.g. amd64)
#
# Returns raw JSON:
#   {
#     "missing_in_a":       ["pkg",...],
#     "missing_in_b":       ["pkg",...],
#     "same_versions":      [{"package":"pkg","version":"1.0"},...],
#     "different_versions": [{"package":"pkg","a_version":"1.1","b_version":"1.0"},...]
#   }
#
# Example resolved key for bookworm:
#   repocompare.result[https://repo.vitexsoftware.com/,https://repo.multiflexi.eu/,bookworm,main,amd64]
#
UserParameter=repocompare.result[*],repocompare --repo-a "$1" --repo-b "$2" --dist "$3" --component "$4" --arch "$5" --output json 2>/dev/null
