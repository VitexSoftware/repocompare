  <!-- ── Comparison arrows ── -->
  <line x1="267" y1="248" x2="397" y2="248" stroke="#EF9F27" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="267" y1="332" x2="397" y2="332" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="267" y1="164" x2="397" y2="164" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="267" y1="206" x2="397" y2="206" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="267" y1="290" x2="397" y2="290" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="267" y1="374" x2="397" y2="374" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ── Legend ── -->
  <rect x="186" y="450" width="310" height="52" rx="10" fill="none" stroke="#D3D1C7" stroke-width="1"/>
  <line x1="204" y1="472" x2="228" y2="472" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
