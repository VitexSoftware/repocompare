    <rect x="416" y="232" width="188" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
    <text font-family="monospace" font-size="11" fill="#633806" x="430" y="252">python3</text>
    <rect x="528" y="238" width="64" height="20" rx="4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.7"/>
