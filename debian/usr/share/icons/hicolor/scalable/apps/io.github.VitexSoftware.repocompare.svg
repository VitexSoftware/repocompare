    <text font-family="monospace" font-size="11" fill="#0C447C" x="90" y="294">git</text>
    <rect x="188" y="280" width="64" height="20" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
    <text font-family="monospace" font-size="10" font-weight="700" fill="#27500A" x="220" y="294" text-anchor="middle">2.39.2</text>

    <rect x="76" y="316" width="188" height="32" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
    <text font-family="monospace" font-size="11" fill="#A32D2D" x="90" y="336">vim-nox</text>
