    <text font-family="monospace" font-size="10" fill="#B5D4F4" x="170" y="126" text-anchor="middle">bookworm · main · amd64</text>

    <rect x="76" y="148" width="188" height="32" rx="6" fill="#ffffff" stroke="#B5D4F4" stroke-width="0.8"/>
    <text font-family="monospace" font-size="11" fill="#0C447C" x="90" y="168">libssl</text>
    <rect x="188" y="154" width="64" height="20" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
    <text font-family="monospace" font-size="10" font-weight="700" fill="#27500A" x="220" y="168" text-anchor="middle">3.0.11</text>

    <rect x="76" y="190" width="188" height="32" rx="6" fill="#ffffff" stroke="#B5D4F4" stroke-width="0.8"/>
