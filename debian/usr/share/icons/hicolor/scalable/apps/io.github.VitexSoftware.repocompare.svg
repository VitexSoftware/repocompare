    <text font-family="monospace" font-size="11" fill="#A32D2D" x="430" y="336">vim-nox</text>
    <rect x="528" y="322" width="64" height="20" rx="4" fill="#ffffff" stroke="#E24B4A" stroke-width="1" stroke-dasharray="4 3"/>
    <text font-family="monospace" font-size="10" font-weight="500" fill="#A32D2D" x="560" y="336" text-anchor="middle">missing</text>

    <rect x="416" y="358" width="188" height="32" rx="6" fill="#ffffff" stroke="#9FE1CB" stroke-width="0.8"/>
    <text font-family="monospace" font-size="11" fill="#085041" x="430" y="378">wget</text>
