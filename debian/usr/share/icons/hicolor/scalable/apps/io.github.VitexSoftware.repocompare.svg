    <rect x="188" y="196" width="64" height="20" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
    <text font-family="monospace" font-size="10" font-weight="700" fill="#27500A" x="220" y="210" text-anchor="middle">7.88.1</text>

    <rect x="76" y="232" width="188" height="32" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
    <text font-family="monospace" font-size="11" fill="#633806" x="90" y="252">python3</text>
    <rect x="188" y="238" width="64" height="20" rx="4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.7"/>
    <text font-family="monospace" font-size="10" font-weight="700" fill="#412402" x="220" y="252" text-anchor="middle">3.11.2</text>

