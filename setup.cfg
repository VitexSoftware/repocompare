[metadata]
name = repocompare
version = 0.1.0
description = Compare Debian package metadata between two APT repositories
long_description = file: README.md
long_description_content_type = text/markdown
author = Vitex Software
author_email = packaging@vitexsoftware.com
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux

[options]
packages = find:
install_requires =
    requests
    python-debian
    python-dotenv
    rich
python_requires = >=3.8

[options.entry_points]
console_scripts =
    repocompare = repocompare.cli:main
